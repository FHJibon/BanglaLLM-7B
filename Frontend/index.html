<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangla LLM</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="app-header">
        <div class="brand-badge">
            <span class="brand-title">Bangla LLM</span>
        </div>
        <div class="header-actions">
            <button class="btn-new-chat" onclick="startNewChat()">
                <span>+</span>
                <span>নতুন চ্যাট</span>
            </button>
        </div>
    </header>
    <main class="main-viewport">
        <div class="chat-container" id="chatMessages">
            <div class="msg-row ai-row">
                <div class="msg-body">
                    আসসালামু আলাইকুম! যেকোনো বিষয়ে প্রশ্ন করতে পারেন।
                </div>
            </div>
        </div>
        <div class="input-dock">
            <div class="dock-card">
                <input type="text" id="userInput" class="text-input" placeholder="যেকোনো প্রশ্ন করুন..."
                    onkeydown="handleKeyPress(event)">
                <button class="send-trigger" onclick="sendMessage()" aria-label="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
            <div class="footer-caption">Bangla LLM • Conversational AI Assistant</div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:8000/api';

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function startNewChat() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = `
                <div class="msg-row ai-row">
                    <div class="msg-body">
                        নতুন চ্যাট শুরু হয়েছে। কীভাবে সাহায্য করতে পারি?
                    </div>
                </div>
            `;
        }

        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const query = inputEl.value.trim();
            if (!query) return;

            inputEl.value = '';
            const chatMessages = document.getElementById('chatMessages');

            const userRow = document.createElement('div');
            userRow.className = 'msg-row user-row';
            userRow.innerHTML = `
                <div class="msg-body">${query}</div>
            `;
            chatMessages.appendChild(userRow);

            const aiRow = document.createElement('div');
            aiRow.className = 'msg-row ai-row';
            const aiBody = document.createElement('div');
            aiBody.className = 'msg-body';
            aiBody.innerHTML = `
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            `;
            aiRow.appendChild(aiBody);
            chatMessages.appendChild(aiRow);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                aiBody.innerText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.replace('data: ', ''));
                                if (data.token) {
                                    aiBody.innerText += data.token;
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                }
                            } catch (e) {
                            }
                        }
                    }
                }
            } catch (err) {
                aiBody.innerText = 'দুঃখিত, সার্ভারের সাথে সংযোগ স্থাপন করা সম্ভব হয়নি।';
            }
        }
    </script>
</body>

</html>
