<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Ultra-Rich Deep Maroon Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <!-- Glossy White-Rose Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>

    <!-- Subtle Gold Accent Glow -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Drop Shadow for 3D Depth -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Posh Rounded Squircle Badge -->
  <rect width="128" height="128" rx="34" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="124" height="124" rx="32" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Master AI Sparkle Glyph (Claude/OpenAI Inspired Elegance) -->
  <g filter="url(#iconShadow)">
    <!-- Main Center 4-Point AI Star -->
    <path d="M64 24 C64 43 70 50 89 50 C70 50 64 57 64 76 C64 57 58 50 39 50 C58 50 64 43 64 24 Z" fill="url(#sparkleGrad)" filter="url(#neonGlow)"/>

    <!-- Top-Right Accent Sparkle -->
    <path d="M92 72 C92 82 95 85 105 85 C95 85 92 88 92 98 C92 88 89 85 79 85 C89 85 92 82 92 72 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom-Left Gold Core Point -->
    <circle cx="42" cy="88" r="4.5" fill="url(#goldAccent)"/>
  </g>
</svg>
